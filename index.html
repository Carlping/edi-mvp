<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>EDI 緊急決策卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="board">
    <div class="brand" id="route">EDI <small>緊急決策卡</small></div>
    <div id="floor-state" class="pill gray">未開始</div>
    <div id="clock" class="clock"><small>距期限</small>—</div>
  </div>
</header>

<main>
  <!-- STEP 1: intake -->
  <section id="intake" class="card">
    <h3>30 秒開場</h3>
    <h2>班機取消了。<span class="sub">不需登入；資料只存在你的手機，不上傳。</span></h2>
    <form id="intake-form">
      <div class="grid2">
        <label>現在在<input name="here" placeholder="TPE" maxlength="3" required autocapitalize="characters" autocomplete="off"></label>
        <label>要回到<input name="home" placeholder="KHH" maxlength="3" required autocapitalize="characters" autocomplete="off"></label>
      </div>
      <div class="grid2">
        <label>被取消的航班<input name="flight" placeholder="BR123" autocapitalize="characters"></label>
        <label>幾小時內必須到<input name="hours" type="number" value="24" min="1" max="72" required inputmode="numeric"></label>
      </div>
      <div class="grid2">
        <label>人數 <span class="hint">含小孩</span><input name="pax" type="number" value="1" min="1" max="9" inputmode="numeric"></label>
        <label class="row" style="align-self:end;padding-bottom:14px"><input name="kids" type="checkbox"> 有 12 歲以下小孩</label>
      </div>
      <fieldset class="conn">
        <label class="row"><input type="checkbox" name="conn" id="conn-toggle"> 我要接下一段航班（保護轉機）</label>
        <div id="conn-fields" class="hidden">
          <div class="grid2">
            <label>下一段航班<input name="conn_flight" placeholder="JL 00:05 JFK→HND" autocomplete="off"></label>
            <label>下一段起飛時間<input name="conn_dep" placeholder="00:05" pattern="([01]?\d|2[0-3]):[0-5]\d" title="HH:MM" inputmode="numeric"></label>
          </div>
          <div class="grid2">
            <label>提前到達緩衝<select name="conn_buffer"><option value="3" selected>3 小時（國際）</option><option value="2">2 小時（國內）</option></select></label>
            <div class="seg conn-seg"><label><input type="radio" name="conn_same" value="same" checked>同一張票</label><label><input type="radio" name="conn_same" value="separate">分開買</label></div>
          </div>
          <p class="hint">「要回到」請填下一段的起飛機場（例 JFK）；期限會自動設為起飛前緩衝時間。</p>
        </div>
      </fieldset>
      <label>信用卡等級 <span class="hint">只用來提示保險，不存卡號</span>
        <select name="card">
          <option value="none">無 / 不確定</option>
          <option value="visa_sig">Visa 御璽/無限</option>
          <option value="mc_world">Mastercard 世界/鈦金</option>
          <option value="amex">American Express</option>
          <option value="jcb">JCB 晶緻/極緻</option>
        </select>
      </label>
      <fieldset>
        <legend>偏好（可跳過）</legend>
        <div class="seg">
          <label><input type="radio" name="pref_time" value="save" checked>省錢優先</label>
          <label><input type="radio" name="pref_time" value="fast">早到優先</label>
        </div>
      </fieldset>
      <fieldset>
        <div class="seg">
          <label><input type="radio" name="pref_risk" value="safe" checked>確定到得了</label>
          <label><input type="radio" name="pref_risk" value="bet">賭最快一班</label>
        </div>
      </fieldset>
      <button type="submit" class="primary big">產生決策卡</button>
    </form>
  </section>

  <!-- STEP 2: decision card -->
  <section id="decision" class="hidden">
    <div class="card stub" id="summary"></div>
    <div class="card" id="tracks"></div>
    <div class="card" id="quotes">
      <h3>價格觀測 · ±1σ 區間</h3>
      <p class="muted" style="margin:0">把你在官網或比價看到的票價填進來，滿 3 筆就算出 p16 / p50 / p84，並告訴你還值不值得再查。</p>
      <div id="quote-list"></div>
      <form id="quote-form" class="inline">
        <input name="label" placeholder="航班，例 CI 22:30" required aria-label="航班">
        <input name="price" type="number" placeholder="票價 TWD" required inputmode="numeric" aria-label="票價">
        <input name="arrive" placeholder="到達 23:10" aria-label="到達時間" pattern="([01]?\d|2[0-3]):[0-5]\d" title="HH:MM" inputmode="numeric" required>
        <button type="submit">＋</button>
      </form>
      <div id="estimate"></div>
    </div>
    <div class="card" id="compare"></div>
    <div class="card" id="rights"></div>
    <div class="card" id="evidence">
      <h3>證據 / 理賠包</h3>
      <div id="checklist"></div>
      <label class="capture">拍照 / 上傳收據 <input id="photo" type="file" accept="image/*" capture="environment" multiple></label>
      <div id="photos" class="thumbs"></div>
      <button id="export" class="secondary">匯出理賠包（單一 HTML 檔）</button>
    </div>
    <div class="card plain">
      <button id="reset" class="danger">清除所有資料</button>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
